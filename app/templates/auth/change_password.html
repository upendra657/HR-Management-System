{% extends "base.html" %}
{% block title %}Change password{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h4 mb-4">Change password</h1>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="current_password">Current password</label>
        <input class="form-control" id="current_password" name="current_password"
               type="password" required autocomplete="current-password">
      </div>
      <div class="mb-3">
        <label class="form-label" for="new_password">New password</label>
        <input class="form-control" id="new_password" name="new_password"
               type="password" required minlength="10" autocomplete="new-password">
        <div class="form-text">At least 10 characters.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm_password">Confirm new password</label>
        <input class="form-control" id="confirm_password" name="confirm_password"
               type="password" required autocomplete="new-password">
      </div>
      <button class="btn btn-primary" type="submit">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
