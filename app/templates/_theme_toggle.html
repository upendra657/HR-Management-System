{# Both icons are always in the DOM; CSS shows whichever suits the theme.
   Swapping them in JS would leave the wrong one visible until the script
   runs. #}
<button class="btn btn-sm btn-outline-secondary theme-toggle" type="button"
        data-theme-toggle aria-pressed="false" aria-label="Switch colour theme"
        title="Switch to dark mode">
  <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
  </svg>
  <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <path d="M20.5 14.4A8.6 8.6 0 1 1 9.6 3.5a7 7 0 0 0 10.9 10.9Z"/>
  </svg>
  <span class="visually-hidden">Toggle dark mode</span>
</button>
