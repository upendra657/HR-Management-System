[project]
name = "hr-management-system"
version = "0.1.0"
description = "Workforce management and analytics platform — Flask, PostgreSQL, SQLAlchemy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Upendra Sharma" }]

dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-SQLAlchemy>=3.1",
    "Flask-Migrate>=4.0",
    "Flask-Login>=0.6",
    "Flask-WTF>=1.2",
    "WTForms>=3.1",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "gunicorn>=21.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "Faker>=24.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-python-dateutil",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]


# --------------------------------------------------------------------------
# Ruff — replaces flake8, black, isort and pyupgrade in one tool
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
# Deliberately 3.10, not the newest runtime: keeping `str, Enum` and
# `timezone.utc` over the 3.11-only `StrEnum` / `datetime.UTC` means the
# project runs on any Python from 3.10 up.
target-version = "py310"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear — likely bugs
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is handled by the formatter
    "B008",     # function calls in argument defaults (common in Flask/SQLAlchemy)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]        # asserts are the point of a test
"migrations/*" = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"


# --------------------------------------------------------------------------
# mypy — deliberately not strict. Strict mode against Flask + SQLAlchemy
# produces a lot of noise for little benefit; tighten these over time.
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["flask_migrate.*", "flask_login.*"]
ignore_errors = true


# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: touches a real database",
]
