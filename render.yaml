# Render blueprint. Point Render at this repo and it provisions both services.
#
# Free tier notes:
#   - the web service sleeps after 15 minutes idle and takes ~30s to wake
#   - the free Postgres instance expires after 30 days and has to be recreated
#
# Migrations and demo setup run in the start command rather than a
# preDeployCommand, which is a paid feature. `setup-demo` is idempotent, so
# a redeploy re-runs it harmlessly instead of wiping the database.

databases:
  - name: hrms-db
    databaseName: hrms
    user: hrms
    plan: free
    # Must match the web service. A database in another region is reachable
    # only over the public internet, which the internal connection string
    # does not use.
    region: frankfurt

services:
  - type: web
    name: hrms
    runtime: python
    plan: free
    region: frankfurt
    # .[demo], not . - the seed generator needs Faker, and setup-demo runs
    # below on first boot. Plain `pip install -e .` builds fine and then
    # fails at start, which is the worst order to find out.
    buildCommand: pip install --upgrade pip && pip install -e ".[demo]"
    # Smaller than the local default of 250/18. The seed has to finish before
    # gunicorn binds the port, and free-tier Postgres is slow enough that
    # ~215k rows risks the deploy timing out. 80 employees over 12 months is
    # still ~35k rows - enough for the charts and the reconciliation report
    # to have something real to say.
    startCommand: >
      flask db upgrade &&
      flask setup-demo --employees 80 --months 12 &&
      gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: FLASK_APP
        value: wsgi.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-db
          property: connectionString
      # Read-only: visitors can browse everything, nothing is written.
      - key: DEMO_MODE
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ITEMS_PER_PAGE
        value: "25"
