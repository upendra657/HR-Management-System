name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff (format)
        run: ruff format --check .
      - name: mypy
        run: mypy app

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    # Tests run against the real engine, so enum types, CHECK constraints
    # and FK behaviour are exercised exactly as in production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms
          POSTGRES_DB: hrms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://hrms:hrms@localhost:5432/hrms_test
      DATABASE_URL: postgresql+psycopg://hrms:hrms@localhost:5432/hrms_test
      SECRET_KEY: ci-testing-key
      FLASK_APP: wsgi.py

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Migrations apply cleanly from scratch
        run: flask db upgrade

      - name: Migrations are reversible
        run: |
          flask db downgrade base
          flask db upgrade

      - name: Models match migrations (no drift)
        run: |
          flask db migrate -m "drift-check" 2>&1 | tee /tmp/drift.log
          if ! grep -q "No changes in schema detected" /tmp/drift.log; then
            echo "::error::Models have drifted from migrations. Run 'flask db migrate' locally and commit the result."
            exit 1
          fi

      - name: pytest
        run: pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
